name: Mathronauts
options:
  bundleIdPrefix: com.ripliquid
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
packages:
  MathronautsCore:
    path: .
targets:
  Mathronauts:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ../../images/space.png
        buildPhase: resources
      - path: ../../images/spaceship4.png
        buildPhase: resources
      - path: ../../images/meteor1.png
        buildPhase: resources
    dependencies:
      - package: MathronautsCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: MATHRONAUTS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
  MathronautsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Mathronauts
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mathronauts:
    build:
      targets:
        Mathronauts: all
    test:
      targets:
        - MathronautsUITests
