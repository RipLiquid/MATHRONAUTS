name: Native iOS
on:
  push:
    branches: [main, feature/ios-native, feature/android-native]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v7
      - name: Record toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test independent game rules
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS Simulator app without signing
        run: >-
          xcodebuild build -project Mathronauts.xcodeproj -scheme Mathronauts
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Upload simulator app
        uses: actions/upload-artifact@v7
        with:
          name: Mathronauts-iOS-Simulator
          path: mobile/ios/DerivedData/Build/Products/Debug-iphonesimulator/Mathronauts.app
          if-no-files-found: error
