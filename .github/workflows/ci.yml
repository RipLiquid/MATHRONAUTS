name: CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-desktop.txt pytest

      - name: Check Python syntax
        run: |
          python -m py_compile "U11-Final CPT.py"
          python -m compileall -q desktop aws/leaderboard

      - name: Run automated tests
        run: |
          python -m pytest tests/ -v
      - name: Test optional desktop launcher with real projectiles
        run: python MATHRONAUTS.py --smoke-test desktop-test-artifacts
      - name: Upload desktop screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mathronauts-Desktop-tests
          path: desktop-test-artifacts/
          if-no-files-found: warn

  leaderboard-live:
    name: AWS Leaderboard Connection
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read live rankings without submitting scores
        run: python -m desktop.check_leaderboard
