name: Native Android
on:
  push:
    branches: [main, feature/android-native]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Gradle wrapper
        run: |
          printf '%s  %s\n' "$(cat gradle/wrapper/wrapper.sha256)" gradle/wrapper/gradle-wrapper.jar | sha256sum -c -
      - name: Install pinned Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build installable debug APK
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator navigation and lifecycle test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          working-directory: mobile/android
          script: |
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb pull /sdcard/Android/data/com.ripliquid.mathronauts/files/screenshots app/build/reports/screenshots
      - name: Upload APK and verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Mathronauts-Android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/reports/
            mobile/android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
